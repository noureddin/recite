<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<<!!sh meta.sh>>
</head>
<body>
<input type="checkbox" id="dark" hidden disabled>
<!-- this checkbox is tied to darkmode_input by js; it's used to avoid FOUC on reload. -->
<!-- https://alexandersandberg.com/theme-switcher/ -->
<div id="body"> <!-- encompasses the content and bg -->
<div id="all">  <!-- encompasses the content only -->

<section id="help">

<input type="checkbox" id="helptoggle" class="tab" onchange="tab_toggled(this)">
<label for="helptoggle">؟</label>
<input type="checkbox" id="optiontoggle" class="tab" onchange="tab_toggled(this)">
<label for="optiontoggle">&nbsp;الخيارات</label>

<div id="options" class="contentcontainer">

  <!-- <hr id="guide"> -->

  <div id="darkmode_option" class="option maybe-inline">
    <label for="darkmode_input">الوضع الليلي؟&ensp;</label><input id="darkmode_input" type="checkbox" onchange="change_dark()">
  </div>
  <div id="teacher_option" class="option maybe-inline">
    <label for="teacher">معلم؟ (التلاوة الصوتية قبل الآية)&ensp;</label><input id="teacher" type="checkbox" onchange="change_teacher()">
  </div>

  <!-- from: http://www.everyayah.com/data/recitations.js -->
  <div class="option">
    <label for="qaris">تلاوة بصوت:&ensp;</label><select id="qaris" onchange="change_qari()">
      <option value="" selected>بغير تلاوة صوتية</option>
<<!!cat res/qaris | while read value; do read title; printf "<option value=%s>%s</option>" "$value" "$title"; done>>
    </select>
    <input type="hidden" id="qariurl" value="">
  </div>

  <div id="quizmode_option" class="option">
    <label for="quizmode">وضع التسميع:&ensp;</label><select id="quizmode" onchange="change_quizmode()">
      <option value="uthm" selected>عثماني (بلا كتابة) &mdash; تغييره يتطلب إعادة التسميع</option>
      <option value="imla">إملائي (كتابة) &mdash; تغييره يتطلب إعادة التسميع</option>
    </select>
  </div>

  <div class="mode_options" id="uthm_options">
    <span id="uthm_options_title" class="mode_options_title">خيارات وضع التسميع العثماني (بلا كتابة):</span>

    <div class="option">
      <label for="tafsir_option">تفسير أو ترجمة:&ensp;</label><select class="tafsir" id="tafsir_option" onchange="change_tafsir()">
        <<!! cat res/tafasir | while read v; do read t; printf '<option value="%s">%s</option>' "$v" "$t"; done >>
      </select>
    </div>

    <div class="option">
      <label for="mvbtns_input">موضع أزار التسميع:&ensp;</label><select id="mvbtns_input" onchange="change_mvbtns()">
        <option value="b" selected>أسفل</option>
        <option value="r">يمين</option>
        <option value="l">يسار</option>
      </select>
    </div>

    <div class="option">
      <label for="textclr_input">تلوين النص:&ensp;</label><select id="textclr_input" onchange="change_tajweed()">
        <option value="taj" selected>تبعا لقواعد التجويد</option>
        <option value="bas">تلوين أجزاء الرسم</option>
        <option value="no">بغير أي تلوين</option>
      </select>
    </div>

    <div class="option maybe-inline">
      <label for="ayatnum_input">تلوين أرقام الآيات؟&ensp;</label><input id="ayatnum_input" type="checkbox" checked onchange="change_ayatnum()">
    </div>

    <div class="option maybe-inline">
      <label for="linebreaks_input">فصل الآيات في أسطر؟&ensp;</label><input id="linebreaks_input" type="checkbox" checked onchange="change_linebreaks()">
    </div>

    <div class="option maybe-inline">
      <label for="tl_input">دلالات ألوان التجويد؟&ensp;</label><input id="tl_input" type="checkbox" checked onchange="change_tajweedlegend()">
    </div>

  </div>

  <div class="mode_options" id="imla_options" style="display:none">
    <span id="imla_options_title" class="mode_options_title">خيارات وضع التسميع الإملائي (كتابة):</span>

    <div class="option">
      <label for="feedbackrate">مراجعة الأخطاء كل:&ensp;</label><select id="feedbackrate" onchange="change_feedbackrate()">
        <option value="l" selected>حرف</option>
        <option value="w">كلمة (صعب)</option>
        <option value="a">آية (شديد الصعوبة)</option>
      </select>
    </div>

  </div>

</div>

<dl class="contentcontainer" id="helpcontent">

<br>
<<!!perl processhelp.pl help.xmd>>

</dl>
</section>

<audio id="player" controls preload></audio>
<audio id="preloader" muted preload></audio>

<!-- I used to use sura_start, sura_end, aya_start, and aya_end, but changed -->
<!--  them to sura_bgn, sura_end, aaya_bgn, and aaya_end to make them equal in -->
<!--  length and show their parallelism, thus making the code a little easier. -->
<!-- Also note that aaya is a more accurate transliteration than aya and ayah, -->
<!--  and rhymes with sura, both have a stressed, long vowel in the first -->
<!--  syllable, and a short unstressed vowel in the second syllable. -->

<p id="title"></p>

<div id="selectors">

  <div class=ss>
    <label for="sura_bgn">من<span class="sura">&nbsp;سورة</span>:&thinsp;</label>
    <select id="sura_bgn"></select>&thinsp;<label for="aaya_bgn"><span class="aaya">الآية:&thinsp;</span></label><select id="aaya_bgn"></select>&thinsp;<button class="search">🔍<span class="srcttl"> ابحث</span></button>
  </div>

  <div class=ss>
    <label for="sura_end">إلى<span class="sura">&nbsp;سورة</span>:&thinsp;</label>
    <select id="sura_end"></select>&thinsp;<label for="aaya_end"><span class="aaya">الآية:&thinsp;</span></label><select id="aaya_end"></select>&thinsp;<button class="search">🔍<span class="srcttl"> ابحث</span></button>
  </div>

<div class=bh>
  <button title="اختر الآيات التي تريد مراجعتها، ثم اضغط على هذا الزر لبدء الاختبار بغير رؤيتها أولا." id="ok">ابدأ&newline;الاختبار</button>
  <button title="اختر الآيات التي تريد مراجعتها، ثم اضغط على هذا الزر لرؤيتها قبل بدء الاختبار." id="show">اعرض&newline;الآيات</button>
</div>

<hr>

</div>

<div hidden id="header">
  <div id="hb" class="bh">
  <button title="اضغط لقراءة الآيات بالكامل." id="reshow">اعرض&newline;الآيات</button>
  <button title="اضغط لإعادة هذا الاختبار من البداية." id="repeat">إعادة</button>
  <button title="اضغط لبدء اختبار جديد." id="new">تغيير&newline;الاختبار</button>
  <button title="اضغط لعدم اعتبار هذا التسميع في برنامج التحفيظ." id="zzignore">تجاهل</button>
  </div>
  <hr id="end_of_header">
</div>

<div id="tafsirhint" class="f">💡&nbsp;اضغط&nbsp;على علامة&nbsp;الآية&nbsp;<span class="A aya">&#x6dd;</span> لإظهار&nbsp;تفسيرها</div>

<div hidden id="uthm_txt"></div>

<div hidden id="imla_txt_container">
<textarea id="imla_txt" placeholder="اكتب هنا"></textarea>
</div>

<div hidden id="endmsg">بارك الله فيك وفتح&nbsp;عليك!&nbsp;<<!!cat res/party-popper.svg>>
<!-- U+1F389 Party Popper, from NotoColorEmoji; https://github.com/googlefonts/noto-emoji/raw/main/svg/emoji_u1f389.svg -->
<p id="endtitle"></p>
<button id="zzback" hidden>عودة</button>
</div>

<!-- these svg arrows were designed in Inkscape by me and optimized with https://vecta.io/nano; CC0 -->
<div id="mvbtns" hidden>
  <button title="أخف آية (زري Ctrl+BackSpace)" id="prevaaya"><<!!cat res/ppp.svg>></button>
  <button title="أخف عبارة - حتى علامة وقف أو نهاية آية (زر رقم الواحد)" id="prevjmla"><<!!cat res/pp.svg>></button>
  <button title="أخف كلمة (زر BackSpace أو سهم يمين)" id="prevword"><<!!cat res/p.svg>></button>
  <button title="أظهر كلمة (زر Space أو Enter أو سهم يسار)" id="nextword"><<!!cat res/n.svg>></button>
  <button title="أظهر عبارة - حتى علامة وقف أو نهاية آية (زر رقم الصفر)" id="nextjmla"><<!!cat res/nn.svg>></button>
  <button title="أظهر آية (زري Ctrl+Space أو Ctrl+Enter)" id="nextaaya"><<!!cat res/nnn.svg>></button>
</div>

<!-- tajweed legend -->
<svg id="tl" aria-expanded="false" viewBox="0 0 155 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="140" height="400" />
  <line x1="450" y1="0" x2="450" y2="400" style="visibility: hidden; opacity: 0" />
  <circle  cx="45"  cy="50" r="15" id="N" /><text x="350"  y="60" style="visibility: hidden; opacity: 0">الإخفاء والغنة (حركتين)</text>
  <circle  cx="45" cy="150" r="15" id="X" /><text x="350" y="160" style="visibility: hidden; opacity: 0">الإدغام وما لا ينطق</text>
  <circle  cx="45" cy="250" r="15" id="R" /><text x="350" y="260" style="visibility: hidden; opacity: 0">تفخيم الراء</text>
  <circle  cx="45" cy="350" r="15" id="Q" /><text x="350" y="360" style="visibility: hidden; opacity: 0">القلقلة</text>
  <circle cx="125"  cy="50" r="15" id="L" /><text x="825"  y="60" style="visibility: hidden; opacity: 0">مد ست (٦) حركات</text>
  <circle cx="125" cy="150" r="15" id="W" /><text x="825" y="160" style="visibility: hidden; opacity: 0">مد أربع (٤) حركات</text>
  <circle cx="125" cy="250" r="15" id="J" /><text x="825" y="260" style="visibility: hidden; opacity: 0">مد حركتين أو أربع أو ست</text>
  <circle cx="125" cy="350" r="15" id="T" /><text x="825" y="360" style="visibility: hidden; opacity: 0">مد حركتين</text>
</svg>

<div id="tvc" class="popup"><!-- tafsir-view container -->
<div id="tv" class="pc"><!-- tafsir-view -->
<div id="tvh"></div><!-- header -->
<div id="tvt"></div><!-- text -->
</div>
<svg class="x" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><!-- tafsir-view close-button -->
<circle cx="5" cy="5" r="5" />
<line x1="2" y1="2" x2="8" y2="8" stroke-width="1.25" />
<line x1="8" y1="2" x2="2" y2="8" stroke-width="1.25" />
</svg>
</div>

<div id="sxc" class="popup"><!-- search container -->
<div id="sx" class="pc"><!-- search -->
<div id="sxi"><select id="sura_sx"></select><input id="sxq"></div>
<div id="sxr"></div><!-- search results -->
</div>
<svg class="x" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><!-- search close-button -->
<circle cx="5" cy="5" r="5" />
<line x1="2" y1="2" x2="8" y2="8" stroke-width="1.25" />
<line x1="8" y1="2" x2="2" y2="8" stroke-width="1.25" />
</svg>
</div>

</div>
</div>

<script src="_scripts.min.js?h=<<!!bash -c "sha256sum _scripts.min.js | sed -E 's/(.{7}).*/\1/' | tr -d $'\n'">>"></script>

</body>
</html>
